name: Update RYM Stats

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to manually trigger it from GitHub whenever you want

jobs:
  scrape-rym:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Stealth Scraping Packages
        run: |
          pip install curl_cffi beautifulsoup4

      - name: Run RYM Scraper
        run: python update_rym.py

      - name: Commit and Push Updated Stats
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update RYM stats" && git push)
