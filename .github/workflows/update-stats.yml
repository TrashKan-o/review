name: Update stats.json

on:
  schedule:
    # Runs once a day at 13:00 UTC (~1am NZDT / midnight NZST)
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python3 scripts/update_stats.py

      - name: Commit changes if stats.json was updated
        run: |
          if git diff --quiet -- stats.json; then
            echo "No changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add stats.json
            git commit -m "Update stats.json [automated]"
            git push
          fi
